<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(255, 224, 130, 0.65), transparent 28%),
    radial-gradient(circle at 90% 8%, rgba(125, 211, 252, 0.65), transparent 30%),
    radial-gradient(circle at 78% 88%, rgba(187, 247, 208, 0.7), transparent 32%),
    linear-gradient(135deg, #fffdf4 0%, #eefaff 45%, #f6fff2 100%);
  color: #123047;
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.app {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 56px;
}

.hero {
  position: relative;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.85);
  border-radius: 34px;
  padding: 34px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 24px 80px rgba(14, 116, 144, 0.16);
}

.hero::after {
  content: "✨";
  position: absolute;
  right: 28px;
  top: 24px;
  font-size: 64px;
  opacity: 0.75;
  animation: float 2.8s ease-in-out infinite;
}

.badge {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 9px 14px;
  border-radius: 999px;
  background: #e0f2fe;
  color: #0369a1;
  font-weight: 900;
  font-size: 14px;
  border: 1px solid #bae6fd;
}

h1 {
  margin: 18px 0 12px;
  font-size: clamp(34px, 6vw, 68px);
  line-height: 1.05;
  letter-spacing: -0.05em;
}

.highlight {
  color: #0891b2;
  text-shadow: 0 6px 0 rgba(125, 211, 252, 0.28);
}

.hero-text {
  width: min(760px, 100%);
  font-size: clamp(17px, 2.3vw, 23px);
  line-height: 1.65;
  color: #315166;
  font-weight: 700;
}

.quick-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.quick-nav button {
  border: 0;
  padding: 12px 16px;
  border-radius: 16px;
  font-weight: 900;
  color: #0f3a4d;
  background: #ffffff;
  box-shadow: 0 10px 24px rgba(8, 145, 178, 0.14);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.quick-nav button:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 32px rgba(8, 145, 178, 0.2);
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 18px;
  margin-top: 22px;
}

.card {
  grid-column: span 6;
  border-radius: 26px;
  padding: 24px;
  background: rgba(255, 255, 255, 0.86);
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 18px 52px rgba(15, 76, 92, 0.1);
}

.card.wide {
  grid-column: 1 / -1;
}

.card h2 {
  margin: 0 0 14px;
  font-size: 26px;
  letter-spacing: -0.04em;
}

.card p,
.card li {
  font-size: 17px;
  line-height: 1.7;
  font-weight: 650;
  color: #334e5f;
}

.icon-title {
  display: flex;
  gap: 12px;
  align-items: center;
}

.big-icon {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  font-size: 30px;
  background: linear-gradient(135deg, #fef3c7, #cffafe);
}

.pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0;
  list-style: none;
}

.pill-list li {
  padding: 10px 13px;
  border-radius: 999px;
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  color: #075985;
}

.pathway {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

.step {
  min-height: 132px;
  padding: 16px;
  border-radius: 22px;
  background: linear-gradient(180deg, #ffffff, #f0fdfa);
  border: 2px dashed #67e8f9;
}

.step strong {
  display: block;
  font-size: 18px;
  margin-bottom: 8px;
  color: #0e7490;
}

.script-box {
  display: grid;
  gap: 12px;
}

.script {
  padding: 16px;
  border-radius: 20px;
  background: #fff7ed;
  border-left: 8px solid #fb923c;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.65;
}

.do-dont {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.do,
.dont {
  padding: 18px;
  border-radius: 22px;
}

.do {
  background: #ecfdf5;
  border: 2px solid #86efac;
}

.dont {
  background: #fff1f2;
  border: 2px solid #fda4af;
}

.quiz-card {
  margin-top: 22px;
  border-radius: 30px;
  padding: 26px;
  background: rgba(255, 255, 255, 0.92);
  border: 3px solid #fde68a;
  box-shadow: 0 24px 70px rgba(245, 158, 11, 0.16);
}

.progress {
  height: 14px;
  border-radius: 999px;
  background: #fef3c7;
  overflow: hidden;
  margin: 14px 0 22px;
}

.progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #22c55e, #06b6d4, #facc15);
  transition: width 0.3s ease;
}

.question {
  font-size: clamp(22px, 3.4vw, 34px);
  line-height: 1.35;
  letter-spacing: -0.04em;
  font-weight: 950;
}

.quiz-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
}

.quiz-buttons button,
.next-btn,
.restart-btn {
  border: 0;
  border-radius: 22px;
  padding: 18px 20px;
  font-size: 22px;
  font-weight: 950;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(15, 76, 92, 0.15);
  transition: transform 0.15s ease;
}

.quiz-buttons button:hover,
.next-btn:hover,
.restart-btn:hover {
  transform: translateY(-3px);
}

.o-btn {
  background: linear-gradient(135deg, #dcfce7, #86efac);
  color: #14532d;
}

.x-btn {
  background: linear-gradient(135deg, #fee2e2, #fda4af);
  color: #7f1d1d;
}

.feedback {
  margin-top: 18px;
  padding: 18px;
  border-radius: 22px;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 850;
}

.feedback.correct {
  background: #ecfdf5;
  color: #14532d;
  border: 2px solid #86efac;
}

.feedback.wrong {
  background: #fff1f2;
  color: #7f1d1d;
  border: 2px solid #fda4af;
}

.next-btn,
.restart-btn {
  margin-top: 16px;
  width: 100%;
  background: linear-gradient(135deg, #bae6fd, #a7f3d0);
  color: #0f3a4d;
}

.result {
  text-align: center;
  padding: 18px;
}

.score {
  font-size: 72px;
  font-weight: 1000;
  color: #0891b2;
  letter-spacing: -0.08em;
}

.small-note {
  color: #64748b;
  font-size: 14px;
  font-weight: 700;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(10px) rotate(8deg); }
}

@media (max-width: 860px) {
  .card {
    grid-column: 1 / -1;
  }

  .pathway {
    grid-template-columns: 1fr;
  }

  .do-dont {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 24px;
  }

  .hero::after {
    display: none;
  }
}
</style>
